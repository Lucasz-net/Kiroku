<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF3B3B" />
    <meta name="description" content="Tu tracker personal de anime" />

    <!-- Open Graph / social link previews. Static (not per-page) since this
         is a client-rendered SPA — link-preview bots (Discord, WhatsApp,
         Twitter/X) don't execute JS, so they only ever see this HTML. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kiroku" />
    <meta property="og:title" content="Kiroku — Tu tracker personal de anime" />
    <meta property="og:description" content="Buscá, seguí y llevá estadísticas de los animes que ves. Rankings, temporadas, perfil público y más." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:url" content="https://kiroku.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kiroku — Tu tracker personal de anime" />
    <meta name="twitter:description" content="Buscá, seguí y llevá estadísticas de los animes que ves." />
    <meta name="twitter:image" content="/logo.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kiroku" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Kiroku</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
